/* Ask box glow \u2014 CLICK-DRIVEN. A subtle green halo at rest; a stronger, more
   saturated glow (+ green border) when the field is clicked/focused. Color and
   resting-halo strength come from the glow tuner (--lpn-glow / --lpn-halo).
   The traveling clockwise arc is parked below (saved for later). */
.lpn-askwrap{
  --lpn-glow:#008661; --lpn-peak:85%; --lpn-halo:24%; --lpn-blur:7px;
  position:relative;
}
.lpn-ask{
  box-shadow:0 0 15px 0 color-mix(in srgb, var(--lpn-glow) var(--lpn-halo), transparent), 0 1px 2px 0 rgba(221,247,235,.05);
  transition:box-shadow .25s ease, border-color .25s ease;
}
.lpn-ask:focus-within{
  border-color:#33c69f;
  box-shadow:0 0 22px 1px color-mix(in srgb, var(--lpn-glow) 24%, transparent), 0 1px 2px 0 rgba(221,247,235,.05);
}

/* \u2500\u2500 SAVED FOR LATER \u2014 traveling clockwise glow arc \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   A rotating ring (near-white sparkle head + green tail) with a soft trail,
   drifting around the field. Removed 2026-07-30. To bring it back: uncomment
   this block AND re-add "isolation:isolate;" to .lpn-askwrap (so the negative-z
   pseudos paint above the page background but under the box's white bg).

@property --lpn-a{syntax:'<angle>';inherits:false;initial-value:0deg;}
@keyframes lpn-orbit{to{--lpn-a:360deg;}}
.lpn-askwrap::before{
  content:''; position:absolute; inset:-3px; border-radius:15px; z-index:-1; pointer-events:none;
  padding:3.5px;
  background:conic-gradient(from var(--lpn-a),
    transparent 0deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .3), transparent) 40deg,
    color-mix(in srgb, var(--lpn-glow) var(--lpn-peak), transparent) 92deg,
    color-mix(in srgb, white 55%, var(--lpn-glow)) 116deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .38), transparent) 146deg,
    transparent 190deg 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite:exclude;
  animation:lpn-orbit 9s linear infinite;
}
.lpn-askwrap::after{
  content:''; position:absolute; inset:-3px; border-radius:15px; z-index:-2; pointer-events:none;
  background:conic-gradient(from var(--lpn-a),
    transparent 0deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .55), transparent) 100deg,
    transparent 176deg 360deg);
  filter:blur(var(--lpn-blur));
  opacity:.55;
  animation:lpn-orbit 9s linear infinite;
}
.lpn-askwrap:focus-within::before,.lpn-askwrap:focus-within::after{opacity:0;}
@media (prefers-reduced-motion:reduce){.lpn-askwrap::before,.lpn-askwrap::after{animation:none;}}

/* Questionnaire \u2014 ConveyorAI drafts answers: answer rows sweep in left-to-right

@keyframes lpn-fill1{0%,8%{transform:scaleX(0)}26%,88%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes lpn-fill2{0%,26%{transform:scaleX(0)}50%,88%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
.lpn-fill1,.lpn-fill2{transform-box:fill-box;transform-origin:left}

@keyframes lpn-float{0%{transform:translateY(0)}30%{transform:translateY(-9px)}55%{transform:translateY(-1px)}72%{transform:translateY(-5px)}100%{transform:translateY(0)}}
.lpn-float{transform-box:fill-box}

.group\\/card:hover .lpn-fill2{animation:lpn-fill2 4.6s cubic-bezier(.4,.5,.2,1) infinite}
.group\\/card:hover .lpn-float{animation:lpn-float 2s cubic-bezier(.3,.7,.4,1) infinite}

/* Ask box \u2014 NORMALIZED (no colored glow). A neutral resting shadow; on focus a
   slightly deeper neutral shadow and a subtle border darken. */
.lpn-askwrap{
  position:relative;
}
.lpn-ask{
  box-shadow:0 1px 2px 0 rgba(32,65,86,.06);
  transition:box-shadow .25s ease, border-color .25s ease;
}
.lpn-ask:focus-within{
  border-color:#c3d2dc;
  box-shadow:0 2px 10px 0 rgba(32,65,86,.08);
}

/* \u2500\u2500 SAVED FOR LATER \u2014 traveling clockwise glow arc \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   A rotating ring (near-white sparkle head + green tail) with a soft trail,
   drifting around the field. Removed 2026-07-30. To bring it back: uncomment
   this block AND re-add "isolation:isolate;" to .lpn-askwrap (so the negative-z
   pseudos paint above the page background but under the box's white bg).

@property --lpn-a{syntax:'<angle>';inherits:false;initial-value:0deg;}
@keyframes lpn-orbit{to{--lpn-a:360deg;}}
.lpn-askwrap::before{
  content:''; position:absolute; inset:-3px; border-radius:15px; z-index:-1; pointer-events:none;
  padding:3.5px;
  background:conic-gradient(from var(--lpn-a),
    transparent 0deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .3), transparent) 40deg,
    color-mix(in srgb, var(--lpn-glow) var(--lpn-peak), transparent) 92deg,
    color-mix(in srgb, white 55%, var(--lpn-glow)) 116deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .38), transparent) 146deg,
    transparent 190deg 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite:exclude;
  animation:lpn-orbit 9s linear infinite;
}
.lpn-askwrap::after{
  content:''; position:absolute; inset:-3px; border-radius:15px; z-index:-2; pointer-events:none;
  background:conic-gradient(from var(--lpn-a),
    transparent 0deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .55), transparent) 100deg,
    transparent 176deg 360deg);
  filter:blur(var(--lpn-blur));
  opacity:.55;
  animation:lpn-orbit 9s linear infinite;
}
.lpn-askwrap:focus-within::before,.lpn-askwrap:focus-within::after{opacity:0;}
@media (prefers-reduced-motion:reduce){.lpn-askwrap::before,.lpn-askwrap::after{animation:none;}}

/* Start-something-new artwork motion. The art rests STATIC on entry (each
   element sits in its natural, completed state) and only animates while its
   card is hovered \u2014 the animation shorthand is scoped to .group/card:hover. */
/* Questionnaire \u2014 ConveyorAI drafts answers: answer rows sweep in left-to-right
   in sequence (the ConveyorAI mark stays static). */
@keyframes lpn-fill1{0%,8%{transform:scaleX(0)}26%,88%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}
@keyframes lpn-fill2{0%,26%{transform:scaleX(0)}50%,88%{transform:scaleX(1)}97%,100%{transform:scaleX(0)}}

/* Ask box glow \u2014 CLICK-DRIVEN. A subtle green halo at rest; a stronger, more
   saturated glow (+ green border) when the field is clicked/focused. Color and
   resting-halo strength come from the glow tuner (--lpn-glow / --lpn-halo).
   The traveling clockwise arc is parked below (saved for later). */
.lpn-askwrap{
  /* Baseline baked 2026-08-07 (tuner can still override via inline vars).
     --lpn-blur = the resting glow's box-shadow blur radius (Blur slider);
     focus scales it 1.5x. */
  --lpn-glow:#008661; --lpn-halo:30%; --lpn-blur:6px;
  /* --lpn-peak: only used by the parked orbiting-arc block below; the
     "Arc strength" tuner control was removed 2026-08-07. */
  --lpn-peak:15%;
  position:relative;
}
.lpn-ask{
  box-shadow:0 0 var(--lpn-blur) 0 color-mix(in srgb, var(--lpn-glow) var(--lpn-halo), transparent), 0 1px 2px 0 rgba(221,247,235,.05);
  transition:box-shadow .25s ease, border-color .25s ease;
}
.lpn-ask:focus-within{
  border-color:#33c69f;
  box-shadow:0 0 calc(var(--lpn-blur) * 1.5) 1px color-mix(in srgb, var(--lpn-glow) 24%, transparent), 0 1px 2px 0 rgba(221,247,235,.05);
}

/* \u2500\u2500 SAVED FOR LATER \u2014 traveling clockwise glow arc \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
   A rotating ring (near-white sparkle head + green tail) with a soft trail,
   drifting around the field. Removed 2026-07-30. To bring it back: uncomment
   this block AND re-add "isolation:isolate;" to .lpn-askwrap (so the negative-z
   pseudos paint above the page background but under the box's white bg).

@property --lpn-a{syntax:'<angle>';inherits:false;initial-value:0deg;}
@keyframes lpn-orbit{to{--lpn-a:360deg;}}
.lpn-askwrap::before{
  content:''; position:absolute; inset:-3px; border-radius:15px; z-index:-1; pointer-events:none;
  padding:3.5px;
  background:conic-gradient(from var(--lpn-a),
    transparent 0deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .3), transparent) 40deg,
    color-mix(in srgb, var(--lpn-glow) var(--lpn-peak), transparent) 92deg,
    color-mix(in srgb, white 55%, var(--lpn-glow)) 116deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .38), transparent) 146deg,
    transparent 190deg 360deg);
  -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  mask-composite:exclude;
  animation:lpn-orbit 9s linear infinite;
}
.lpn-askwrap::after{
  content:''; position:absolute; inset:-3px; border-radius:15px; z-index:-2; pointer-events:none;
  background:conic-gradient(from var(--lpn-a),
    transparent 0deg,
    color-mix(in srgb, var(--lpn-glow) calc(var(--lpn-peak) * .55), transparent) 100deg,
    transparent 176deg 360deg);
  filter:blur(var(--lpn-blur));
  opacity:.55;
  animation:lpn-orbit 9s linear infinite;
}
.lpn-askwrap:focus-within::before,.lpn-askwrap:focus-within::after{opacity:0;}
